<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <linearGradient id="warmSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#faedd9" />
    </linearGradient>
    <linearGradient id="wallTone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ede6db" />
      <stop offset="100%" stop-color="#dfd7cc" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#warmSky)" />

  <!-- Sun / Warm Ambiance -->
  <circle cx="560" cy="110" r="60" fill="#fce4c4" opacity="0.6" />

  <!-- Distant Estate Trees -->
  <path d="M 0 350 Q 80 320 160 345 T 320 330 T 480 340 T 640 330 T 700 345 L 700 500 L 0 500 Z" fill="#b9cbaf" opacity="0.5" />
  <path d="M 0 370 Q 100 350 200 365 T 400 350 T 600 365 T 700 360 L 700 500 L 0 500 Z" fill="#8ca680" opacity="0.7" />

  <!-- School Main Building Architecture -->
  <polygon points="120,400 120,240 380,240 380,400" fill="url(#wallTone)" stroke="#c5bbae" stroke-width="2" />
  
  <!-- Classic Modern Gable Roof -->
  <polygon points="100,240 250,160 400,240" fill="#1c2b39" />
  <polygon points="108,240 250,165 392,240" fill="#243545" />

  <!-- Mosque Minaret Silhouette in Proximity -->
  <rect x="450" y="210" width="45" height="190" fill="#2a4736" rx="4" />
  <path d="M 445 210 Q 472 165 500 210 Z" fill="#243d2e" />
  <line x1="472.5" y1="165" x2="472.5" y2="145" stroke="#c86d51" stroke-width="2.5" />
  <circle cx="472.5" cy="142" r="3" fill="#c86d51" />

  <!-- School Windows & Entry Arch -->
  <rect x="150" y="270" width="38" height="50" rx="4" fill="#1c2b39" opacity="0.8" />
  <rect x="210" y="270" width="38" height="50" rx="4" fill="#1c2b39" opacity="0.8" />
  <rect x="270" y="270" width="38" height="50" rx="4" fill="#1c2b39" opacity="0.8" />
  <rect x="330" y="270" width="30" height="50" rx="4" fill="#1c2b39" opacity="0.8" />

  <!-- Main School Arch Door -->
  <path d="M 230 400 L 230 350 A 25 25 0 0 1 280 350 L 280 400 Z" fill="#c86d51" />

  <!-- Foreground Courtyard / Lawn -->
  <rect x="0" y="400" width="700" height="100" fill="#67845c" />
  <path d="M 0 430 L 700 430" stroke="#fbf9f5" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Students Walking Safely in Courtyard (Silhouettes) -->
  <circle cx="255" cy="425" r="7" fill="#1c2b39" />
  <path d="M 251 432 L 259 432 L 261 455 L 249 455 Z" fill="#1c2b39" />

  <circle cx="275" cy="427" r="6" fill="#1c2b39" />
  <path d="M 271 433 L 279 433 L 280 455 L 270 455 Z" fill="#1c2b39" />

  <circle cx="330" cy="422" r="8" fill="#1c2b39" />
  <path d="M 324 430 L 336 430 L 338 460 L 322 460 Z" fill="#1c2b39" />

  <!-- Estate Gate Fence Hairline -->
  <line x1="20" y1="410" x2="680" y2="410" stroke="#dfd7cc" stroke-width="2" />
  <line x1="50" y1="400" x2="50" y2="420" stroke="#dfd7cc" stroke-width="2" />
  <line x1="100" y1="400" x2="100" y2="420" stroke="#dfd7cc" stroke-width="2" />
  <line x1="600" y1="400" x2="600" y2="420" stroke="#dfd7cc" stroke-width="2" />
  <line x1="650" y1="400" x2="650" y2="420" stroke="#dfd7cc" stroke-width="2" />
</svg>
